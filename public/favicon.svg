<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4f934" />
      <stop offset="100%" stop-color="#9ebd00" />
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Dark Rounded Square Container -->
  <rect width="96" height="96" x="2" y="2" rx="24" fill="#080808" stroke="url(#glowGrad)" stroke-width="4"/>
  
  <!-- Outer Ambient Glow Border Ring -->
  <rect width="84" height="84" x="8" y="8" rx="20" fill="none" stroke="#d4f934" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.4"/>

  <!-- High Impact Stylized AI Sparkle & P Icon -->
  <g filter="url(#neon)">
    <!-- Central AI Sparkle Top -->
    <path d="M50 18 L54 36 L72 40 L54 44 L50 62 L46 44 L28 40 L46 36 Z" fill="url(#glowGrad)" />
    
    <!-- Punjabi / Pendu AI Crown Dot Accent -->
    <circle cx="50" cy="74" r="6" fill="#d4f934" />
  </g>
</svg>
